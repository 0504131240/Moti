const FB_CFG={apiKey:"AIzaSyDU4O_IGPDLc7VkHR5ZvRbLzU6HKSa1C_E",authDomain:"moti1-848e7.firebaseapp.com",projectId:"moti1-848e7",storageBucket:"moti1-848e7.firebasestorage.app",messagingSenderId:"177637818983",appId:"1:177637818983:web:4830fff93f2dfa6746cac2"};
// db is set only once a Google account is signed in and its profiles are loaded;
// fdb is the Firestore handle itself. Every profile's data lives under
// profiles/{id}/data/*, readable only by the emails listed on the profile.
let db=null,fdb=null,auth=null,AUTH_USER=null,unsubFire=null,_doc=null,_setDoc=null,_onSnapshot=null,_getDoc=null,_F=null,_A=null;
function pDoc(name,pid){return _doc(fdb,'profiles',pid||CUR_UID,'data',name);}
function myEmail(){return(AUTH_USER?.email||'').toLowerCase();}
let USERS=[],CUR_UID='u1';
let EVENTS=[];
function loadEvents(){try{EVENTS=JSON.parse(localStorage.getItem('bdg_evt_'+CUR_UID)||'[]');}catch{EVENTS=[];}}
function saveEvents(){
  try{localStorage.setItem('bdg_evt_'+CUR_UID,JSON.stringify(EVENTS));}catch{}
  fbSaveEvents();
}
function fbSaveEvents(){
  if(!db||!_setDoc||!_doc)return;
  _setDoc(pDoc('evt'),{events:EVENTS}).catch(e=>console.warn('FB evt save:',e));
}
function fbLoadEvents(){
  if(!db||!_getDoc||!_doc)return;
  _getDoc(pDoc('evt')).then(snap=>{
    const fbEvts=snap.exists()?(snap.data().events||[]):[];
    // Events kept only on this device (e.g. never synced) are uploaded so other devices see them
    const localOnly=EVENTS.some(e=>!fbEvts.find(fe=>fe.id===e.id));
    // Merge: add any event from Firebase that isn't in local storage
    let changed=false;
    fbEvts.forEach(fe=>{
      if(!EVENTS.find(e=>e.id===fe.id)){EVENTS.push(fe);changed=true;}
    });
    if(localOnly)fbSaveEvents();
    if(changed){
      try{localStorage.setItem('bdg_evt_'+CUR_UID,JSON.stringify(EVENTS));}catch{}
      if(g('evO')||g('evdO'))rEvents();
    }
  }).catch(e=>console.warn('FB evt load:',e));
}
// USERS = the profiles the signed-in Google account may access (cached for offline start)
function loadUsers(){
  try{USERS=JSON.parse(localStorage.getItem('bdg_profiles')||'[]');}catch{USERS=[];}
  try{CUR_UID=localStorage.getItem('bdg_cur_user')||'';}catch{CUR_UID='';}
  if(!USERS.find(u=>u.id===CUR_UID))CUR_UID=USERS[0]?.id||'u1';
}
function saveUsers(){
  try{localStorage.setItem('bdg_profiles',JSON.stringify(USERS));}catch{}
  try{localStorage.setItem('bdg_cur_user',CUR_UID);}catch{}
  fbSaveUsers();
}
// Fields the app owns on a profile doc; merged so server-side fields (lastMailDay) are kept
function profData(u){
  const d={name:u.name,emails:u.emails||[myEmail()],reminders:u.reminders||[],mailSummary:!!u.mailSummary,pin:u.pin||_F.deleteField()};
  if(u.monthStart)d.monthStart=u.monthStart;
  return d;
}
function fbSaveUsers(){
  if(!db)return;
  USERS.forEach(u=>_setDoc(_doc(fdb,'profiles',u.id),profData(u),{merge:true}).catch(e=>console.warn('FB profile save:',e)));
}
async function fbLoadProfiles(){
  const email=myEmail();
  let qs;
  try{qs=await _F.getDocs(_F.query(_F.collection(fdb,'profiles'),_F.where('emails','array-contains',email)));}
  catch(e){
    console.warn('FB profiles load:',e);
    // Offline: keep working from this account's cached profiles
    if(USERS.length&&localStorage.getItem('bdg_auth')===email){db=fdb;reloadCurUser();rLockScreen();}
    else rLogin('אין חיבור לשרת. נסה שוב מאוחר יותר.');
    return;
  }
  const hadCur=!!USERS.find(u=>u.id===CUR_UID)&&localStorage.getItem('bdg_auth')===email;
  USERS=qs.docs.map(d=>({id:d.id,...d.data()}));
  try{localStorage.setItem('bdg_auth',email);localStorage.setItem('bdg_profiles',JSON.stringify(USERS));}catch{}
  if(!USERS.length){db=null;rWelcome();return;}
  if(!USERS.find(u=>u.id===CUR_UID))CUR_UID=USERS[0].id;
  try{localStorage.setItem('bdg_cur_user',CUR_UID);}catch{}
  db=fdb;reloadCurUser();
  // The mail job reads the cycle start day from the profile; copy this device's setting there
  {const cu=USERS.find(u=>u.id===CUR_UID),ms=parseInt(getCfg().monthStart)||0;if(cu&&ms>1&&cu.monthStart!==ms){cu.monthStart=ms;saveUsers();}}
  if(!hadCur&&USERS.length>1)rPickUser();else rLockScreen();
}
function reloadCurUser(){
  ld();loadEvents();
  if(db){fbListen(S.year);fbLoadBudgets();fbLoadEvents();}
}
function fbSave(){
  if(!db||!_setDoc||!_doc)return;
  _setDoc(pDoc('y'+S.year),{cats:S.cats,mData:S.mData}).catch(e=>console.warn('FB save:',e));
}
function saveBudgets(){
  const bdata=S.cats.map(c=>({id:c.id,budget:c.budget||0,budgetRec:c.budgetRec||0,subs:(c.subs||[]).map(s=>({id:s.id,budget:s.budget||0}))}));
  try{localStorage.setItem('bdg_bud_'+CUR_UID,JSON.stringify(bdata));}catch{}
  if(db&&_setDoc&&_doc)_setDoc(pDoc('bud'),{b:bdata}).catch(e=>console.warn('FB bud save:',e));
}
function applyBudgets(cats){
  try{
    const r=localStorage.getItem('bdg_bud_'+CUR_UID);if(!r)return;
    JSON.parse(r).forEach(b=>{
      const c=cats.find(c=>c.id===b.id);if(!c)return;
      if(b.budget>0)c.budget=b.budget;else delete c.budget;
      if(b.budgetRec>0)c.budgetRec=b.budgetRec;else delete c.budgetRec;
      if(b.subs&&c.subs)b.subs.forEach(sb=>{const s=c.subs.find(s=>s.id===sb.id);if(s){if(sb.budget>0)s.budget=sb.budget;else delete s.budget;}});
    });
  }catch{}
}
function fbLoadBudgets(){
  if(!db||!_getDoc||!_doc)return;
  _getDoc(pDoc('bud')).then(snap=>{
    if(!snap.exists())return;
    const bdata=snap.data().b||[];
    try{localStorage.setItem('bdg_bud_'+CUR_UID,JSON.stringify(bdata));}catch{}
    applyBudgets(S.cats);rAll();
  }).catch(e=>console.warn('FB bud load:',e));
}
function fbListen(year){
  if(!db||!_onSnapshot||!_doc){return;}
  if(unsubFire)unsubFire();
  unsubFire=_onSnapshot(pDoc('y'+year),snap=>{
    if(!snap.exists())return;
    const d=snap.data();
    S.cats=d.cats||DF.map(c=>({...c}));
    S.mData=d.mData||iMD(S.cats);
    eC(S.cats,S.mData);ensureCharity();
    const _start=parseInt(getCfg().monthStart)||1;
    if(_start>1){const _nd=migrateToStartDay(S.mData,S.cats,_start);if(JSON.stringify(_nd)!==JSON.stringify(S.mData)){S.mData=_nd;fbSave();}}
    applyBudgets(S.cats);
    try{localStorage.setItem(sk(year),JSON.stringify({cats:S.cats,mData:S.mData}));}catch{}
    const open=['m1','m2','m3'].some(id=>{const el=g(id);return el&&el.innerHTML.trim();});
    if(!open)rAll();
    setSyncDot(true);
  },e=>{console.warn('FB listen:',e);setSyncDot(false);});
}
function setSyncDot(ok){const el=g('syncDot');if(el)el.style.background=ok?'#4f8a68':'#cf5a3e';}

function getCfg(){try{return JSON.parse(localStorage.getItem('bdg_cfg_'+CUR_UID)||'{}');}catch{return{};}}
function saveCfg(c){try{localStorage.setItem('bdg_cfg_'+CUR_UID,JSON.stringify({...getCfg(),...c}));}catch{}}
function cycleMonthForDate(dateStr,start){
  if(!dateStr||start<=1)return null;
  try{const p=dateStr.split('-'),day=parseInt(p[2]),month=parseInt(p[1])-1;
  if(day>=start)return month;
  if(month===0)return null;// Jan→Dec crosses year, keep in place
  return month-1;}catch{return null;}
}
function migrateToStartDay(mData,cats,start){
  if(start<=1)return mData;
  const nd={};
  for(let m=0;m<12;m++){nd[m]={income:[]};cats.forEach(c=>{nd[m][c.id]={entries:[]};});}
  for(let m=0;m<12;m++){
    if(!mData[m])continue;
    (mData[m].income||[]).forEach(e=>{const t=cycleMonthForDate(e.date,start);(t!==null?nd[t]:nd[m]).income.push(e);});
    cats.forEach(c=>{(mData[m]?.[c.id]?.entries||[]).forEach(e=>{
      const t=e.recurring?null:cycleMonthForDate(e.date,start);
      nd[t!==null?t:m][c.id].entries.push(e);
    });});
  }
  return nd;
}
function todayPeriod(){
  const d=new Date(),day=d.getDate(),start=parseInt(getCfg().monthStart)||1;
  if(start<=1)return{month:d.getMonth(),year:d.getFullYear()};
  if(day>=start)return{month:d.getMonth(),year:d.getFullYear()};
  const m=d.getMonth()-1;
  return m<0?{month:11,year:d.getFullYear()-1}:{month:m,year:d.getFullYear()};
}
const MO=["ינואר","פברואר","מרץ","אפריל","מאי","יוני","יולי","אוגוסט","ספטמבר","אוקטובר","נובמבר","דצמבר"];
function moLabel(m){
  const start=parseInt(getCfg().monthStart)||1;
  if(start>=15)return MO[(m+1)%12];
  return MO[m];
}
function cycleRangeLabel(m){
  const start=parseInt(getCfg().monthStart)||1;
  if(start<=1)return '';
  return `${start} ${MO[m]} – ${start-1} ${MO[(m+1)%12]}`;
}
const CL=["#6366f1","#0ea5e9","#f59e0b","#10b981","#8b5cf6","#ef4444","#f97316","#14b8a6","#ec4899","#84cc16"];
const DF=[
  {id:1,name:"מזון וקניות",budget:3000,color:"#5b7f6b"},
  {id:2,name:"חשבונות ותשלומים",budget:2000,color:"#0ea5e9"},
  {id:3,name:"תחבורה",budget:1000,color:"#f59e0b"},
  {id:4,name:"בריאות",budget:800,color:"#4f8a68"},
  {id:5,name:"חינוך",budget:1500,color:"#6f9480"},
];

let S={year:new Date().getFullYear(),month:new Date().getMonth(),view:"monthly",cats:[],mData:{},aCat:null,eCat:null,nc:{name:"",budget:"",budgetRec:"",color:"#5b7f6b",isRec:false},sortEnt:"date",editEntId:null,expFilter:"variable",chartIdx:0};
let deferredPrompt=null,touchStartX=0,touchStartY=0,touchStartTarget=null;

// "צדקה" is a built-in category: always present (found by flag or name), used for maaser
function charityCat(){return S.cats.find(c=>c.builtin==='charity')||S.cats.find(c=>(c.name||'').trim()==='צדקה');}
function ensureCharity(){
  let c=charityCat();
  if(!c){c={id:Math.max(0,...S.cats.map(x=>x.id))+1,name:'צדקה',color:'#b56b7c'};S.cats.push(c);}
  c.builtin='charity';
  eC(S.cats,S.mData);
}
function sk(y){return"bdg_v4_"+CUR_UID+"_"+y;}
function iMD(c){const m={};for(let i=0;i<12;i++){m[i]={income:[]};c.forEach(x=>{m[i][x.id]={entries:[]};});}return m;}
function eC(c,m){for(let i=0;i<12;i++){if(!m[i])m[i]={income:[]};if(!m[i].income)m[i].income=[];c.forEach(x=>{if(!m[i][x.id])m[i][x.id]={entries:[]};});}return m;}
function ld(){
  if(CUR_UID==='u1'){try{const nk=sk(S.year),ok="bdg_v4_"+S.year;if(!localStorage.getItem(nk)&&localStorage.getItem(ok)){localStorage.setItem(nk,localStorage.getItem(ok));}}catch{}}
  try{
    let r=localStorage.getItem(sk(S.year));if(!r)r=localStorage.getItem("bdg_v3_"+S.year);
    if(r){const s=JSON.parse(r);S.cats=s.cats||DF.map(c=>({...c}));S.mData=s.mData||iMD(S.cats);eC(S.cats,S.mData);}
    else{
      let inh=false;
      try{
        const pr=localStorage.getItem(sk(S.year-1))||localStorage.getItem("bdg_v3_"+(S.year-1));
        if(pr){
          const ps=JSON.parse(pr);
          S.cats=(ps.cats||DF.map(c=>({...c}))).map(c=>({...c}));
          S.mData=iMD(S.cats);
          const pm=ps.mData||{};
          S.cats.forEach(cat=>{
            const seen=new Set();
            for(let m=0;m<12;m++){(pm[m]?.[cat.id]?.entries||[]).filter(e=>e.recurring).forEach(e=>{const bid=e.id-m*1000;if(!seen.has(bid)){seen.add(bid);for(let nm=0;nm<12;nm++){if(S.mData[nm]?.[cat.id])S.mData[nm][cat.id].entries.push({id:bid+nm*1000,desc:e.desc,amount:e.amount,date:adjDate(e.date,nm,S.year),recurring:true,subCat:e.subCat||null});}}});}
          });
          sv();inh=true;
        }
      }catch{}
      if(!inh){S.cats=DF.map(c=>({...c}));S.mData=iMD(S.cats);}
    }
  }catch{S.cats=DF.map(c=>({...c}));S.mData=iMD(S.cats);}
  ensureCharity();
  applyBudgets(S.cats);
}
function sv(){
  try{localStorage.setItem(sk(S.year),JSON.stringify({cats:S.cats,mData:S.mData}));}catch{}
  saveBudgets();
  fbSave();
}
function fm0(n){return fm(Math.round(parseFloat(n)||0));}
function fm(n){return Number(n||0).toLocaleString("he-IL");}
function today(){return new Date().toISOString().split("T")[0];}
function fmDate(d){if(!d)return"";try{const p=d.split("-");return p[2]+"/"+p[1];}catch{return d;}}
function ct(mo,id){return(S.mData[mo]?.[id]?.entries||[]).reduce((s,e)=>s+(parseFloat(e.amount)||0),0);}
function mt(mo){return S.cats.reduce((s,c)=>s+ct(mo,c.id),0);}
function cyt(id){let t=0;for(let m=0;m<12;m++)t+=ct(m,id);return t;}
function gt(){return S.cats.reduce((s,c)=>s+cyt(c.id),0);}
function incT(mo){return(S.mData[mo]?.income||[]).reduce((s,e)=>s+(parseFloat(e.amount)||0),0);}

// Dark mode (per device): swap the light palette for a warm dark one in everything rendered
let DARK=false;try{DARK=localStorage.getItem('bdg_dark')==='1';}catch{}
const DK={'#f5efe6':'#17140f','#fffdf9':'#221e18','#ffffff':'#221e18','#f7f1e8':'#2a251e','#faf6ef':'#2a251e','#f3ece2':'#2a251e','#efe7db':'#302a22',
 '#ece4d8':'#3a332a','#e6dccd':'#3a332a','#f0e8dc':'#332d25','#d6ccbe':'#5d554a','#c4b8a8':'#6a6155','#2f2a24':'#ede6db','#5e554a':'#cfc5b8',
 '#7d7265':'#a89d8f','#8a7f72':'#a89d8f','#a39686':'#8c8172','#5b7f6b':'#7fa58f','#6f9480':'#8fb39f','#4a6b58':'#8fbf9f','#3f7356':'#86c09c','#4f8a68':'#6fae86',
 '#e9f0eb':'#26332b','#eef3ef':'#26332b','#eef5ef':'#26332b','#e4efe6':'#26332b','#d4e4d8':'#35473b','#c9d9ce':'#35473b','#d8e6dc':'#35473b','#d5e2d9':'#35473b','#f3f7f4':'#26332b',
 '#fbe9e2':'#3a2620','#f8e4dc':'#3a2620','#fbefe9':'#3a2620','#f0cfc2':'#5a3a2e','#ebb9a8':'#5a3a2e','#f8eef0':'#36262a','#e2bcc5':'#5a3c44','#9e5868':'#d59aa8','#b56b7c':'#d59aa8',
 '#fffbeb':'#352c1a','#fde68a':'#5c4a22','#fef3c7':'#352c1a'};
function darken(h){
  return h.replace(/background:#fff(?![0-9a-fA-F])/g,'background:#221e18').replace(/#[0-9a-fA-F]{6}\b/g,c=>DK[c.toLowerCase()]||c);
}

function ih(id,h){const e=g(id);if(e)e.innerHTML=DARK?darken(h):h;}

function adjDate(dateStr,month,year){
  if(!dateStr)return today();
  const p=dateStr.split('-');
  const y=year||parseInt(p[0]);
  const day=parseInt(p[2]);
  const lastDay=new Date(y,month+1,0).getDate();
  return String(y)+'-'+String(month+1).padStart(2,'0')+'-'+String(Math.min(day,lastDay)).padStart(2,'0');
}

// Change another year's data: start from the cloud copy (else this device's), save to both
async function editYear(fy,fn,onlyExisting){
  let d=null;
  if(db){try{const sn=await _getDoc(pDoc('y'+fy));if(sn.exists())d=sn.data();}catch(e){console.warn('FB year load:',e);}}
  if(!d){try{d=JSON.parse(localStorage.getItem(sk(fy))||'null');}catch{}}
  if(!d||!d.mData){if(onlyExisting)return;d={cats:S.cats.map(c=>({...c})),mData:iMD(S.cats)};}
  if(fn(d)===false)return;
  try{localStorage.setItem(sk(fy),JSON.stringify(d));}catch{}
  if(db)_setDoc(pDoc('y'+fy),d).catch(e=>console.warn('FB year save:',e));
}
function applyToFutureYears(baseId,catId,fn){
  for(let fy=S.year+1;fy<=S.year+10;fy++){
    editYear(fy,fd=>{
      let chg=false;
      for(let m=0;m<12;m++){
        const c=fd.mData?.[m]?.[catId];if(!c)continue;
        const r=fn(c.entries||[],baseId+m*1000,m,fy);
        if(r!==undefined){c.entries=r;chg=true;}
      }
      return chg;
    },true);
  }
}

// Budget month a date belongs to, honoring "month starts on day N": {y, m}
function dateBucket(ds){
  const [y,mo,d]=ds.split('-').map(Number),st=parseInt(getCfg().monthStart)||1;
  let m=mo-1,yy=y;if(st>1&&d<st){m--;if(m<0){m=11;yy--;}}
  return{y:yy,m};
}
// The date with ds's day of month that falls in budget month (by, bm)
function bucketDate(ds,by,bm){
  const d=parseInt(ds.split('-')[2]),st=parseInt(getCfg().monthStart)||1;
  const abs=by*12+bm+((st>1&&d<st)?1:0);
  return adjDate(ds,abs%12,Math.floor(abs/12));
}

// Installment series: payments "desc (k/N)" with ids base+(k-1)*1000 in consecutive months
function instInfo(e){
  if(!e||e.recurring)return null;
  if(e.inst)return e.inst;
  const m=/\((\d+)\/(\d+)\)\s*$/.exec(e.desc||'');if(!m)return null;
  const k=+m[1],n=+m[2];if(n<2||k<1||k>n)return null;
  return{base:e.id-(k-1)*1000,n,i:k-1};
}
const instBase=d=>(d||'').replace(/\s*\(\d+\/\d+\)\s*$/,'');
const instDesc=(b,k,n)=>b?(b+' ('+k+'/'+n+')'):(k+'/'+n);
// Run fn(entry,k,year,month) on every payment of the series of `e` (an entry of S.month);
// fn returns the new entry, or null to delete it
function forInstSeries(e,catId,fn){
  const info=instInfo(e),start=S.year*12+S.month-info.i,byYear={};
  for(let k=0;k<info.n;k++){const abs=start+k;(byYear[Math.floor(abs/12)]=byYear[Math.floor(abs/12)]||[]).push({k,m:abs%12});}
  const apply=(mData,list,y)=>{
    let chg=false;
    list.forEach(({k,m})=>{
      const c=mData?.[m]?.[catId];if(!c)return;
      const id=info.base+k*1000,out=[];
      (c.entries||[]).forEach(x=>{if(x.id===id){chg=true;const r=fn(x,k,y,m);if(r)out.push(r);}else out.push(x);});
      c.entries=out;
    });
    return chg;
  };
  Object.keys(byYear).forEach(ys=>{const y=+ys;if(y===S.year)apply(S.mData,byYear[y],y);else editYear(y,d=>apply(d.mData,byYear[y],y),true);});
  sv();
}

function trendHTML(catId){
  const curr=ct(S.month,catId),prev=ct((S.month-1+12)%12,catId);
  if(!prev||!curr)return"";
  const pct=Math.round(((curr-prev)/prev)*100);
  if(pct>5)return`<span style="font-size:10px;color:#cf5a3e">&#9650;${pct}%</span>`;
  if(pct<-5)return`<span style="font-size:10px;color:#4f8a68">&#9660;${Math.abs(pct)}%</span>`;
  return`<span style="font-size:10px;color:#a39686">&rarr;</span>`;
}

function rPie(){
  const total=mt(S.month);
  if(!total)return"";
  const slices=S.cats.map(cat=>({cat,val:ct(S.month,cat.id)})).filter(s=>s.val>0);
  if(!slices.length)return"";
  let angle=-Math.PI/2,paths="",legend="";
  const r=52,cx=62,cy=62;
  slices.forEach(s=>{
    const pct=s.val/total,sa=angle;
    angle+=pct*2*Math.PI;
    if(pct>0.999){paths+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="${s.cat.color}"/>`;}
    else{const x1=(cx+r*Math.cos(sa)).toFixed(1),y1=(cy+r*Math.sin(sa)).toFixed(1),x2=(cx+r*Math.cos(angle)).toFixed(1),y2=(cy+r*Math.sin(angle)).toFixed(1);paths+=`<path d="M${cx},${cy} L${x1},${y1} A${r},${r} 0 ${pct>0.5?1:0},1 ${x2},${y2} Z" fill="${s.cat.color}"/>`;}
    legend+=`<div style="display:flex;align-items:center;gap:4px"><div style="width:7px;height:7px;border-radius:50%;background:${s.cat.color};flex-shrink:0"></div><span style="font-size:10px;color:#7d7265">${s.cat.name}</span><span style="font-size:10px;font-weight:700;color:#2f2a24">${Math.round(pct*100)}%</span></div>`;
  });
  return`<div style="background:#f3f7f4;border-radius:14px;padding:14px 16px;border:1px solid #d5e2d9">
    <div style="font-size:12px;color:#5b7f6b;font-weight:700;margin-bottom:10px">&#128202; פילוח הוצאות</div>
    <div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap">
      <svg viewBox="0 0 124 124" width="100" height="100" style="flex-shrink:0">${paths}</svg>
      <div style="display:flex;flex-direction:column;gap:5px">${legend}</div>
    </div>
  </div>`;
}

function rLineChart(){

  const max=Math.max(...vals,1);
  const W=300,H=110,px=10,py=8,bh=16,iw=280,ih=H-py-bh;
  const pts=vals.map((v,i)=>{const x=px+(11-i)*(iw/11);const y=py+ih-(v/max)*ih;return[x,y];});
  const line=pts.map(p=>p.join(',')).join(' ');
  const area=`${W-px},${py+ih} ${line} ${px},${py+ih}`;
  const [cx,cy]=pts[S.month];
  const lbls=MO.map((m,i)=>{const[x]=pts[i];return`<text x="${x.toFixed(1)}" y="${H-2}" text-anchor="middle" font-size="8" fill="${i===S.month?'#5b7f6b':'#a39686'}">${m[0]}</text>`;}).join('');
  const dots=pts.map(([x,y],i)=>`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${i===S.month?5:2.5}" fill="${i===S.month?'#5b7f6b':'#6f9480'}" stroke="#fff" stroke-width="1.5"/>`).join('');
  const tip=vals[S.month]?`<text x="${cx.toFixed(1)}" y="${(cy-9).toFixed(1)}" text-anchor="middle" font-size="9" font-weight="700" fill="#5b7f6b">&#8362;${fm(vals[S.month])}</text>`:'';
  return`<div style="background:#f3f7f4;border-radius:14px;padding:10px 12px;border:1px solid #d5e2d9">
    <div style="font-size:12px;color:#5b7f6b;font-weight:700;margin-bottom:8px">&#128200; מגמת הוצאות שנתית</div>
    <svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" style="display:block">
      <defs><linearGradient id="lgA" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#5b7f6b" stop-opacity=".25"/><stop offset="100%" stop-color="#5b7f6b" stop-opacity="0"/></linearGradient></defs>
      <polygon points="${area}" fill="url(#lgA)"/>
      <polyline points="${line}" fill="none" stroke="#5b7f6b" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      ${dots}${tip}${lbls}
    </svg>
  </div>`;
}
function rStackedBar(){
  const W=300,H=110,px=6,py=8,bh=16,iw=288,ih=H-py-bh;
  const max=Math.max(...Array.from({length:12},(_,m)=>mt(m)),1);
  const slot=iw/12,bw=slot-3;
  const bars=Array.from({length:12},(_,m)=>{const x=px+m*slot+1.5;let y=py+ih;return S.cats.map(cat=>{const v=ct(m,cat.id);if(!v)return'';const h=(v/max)*ih;y-=h;return`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" fill="${cat.color}" rx="1" opacity="${m===S.month?1:.65}"/>`;}).join('');}).join('');
  const lbls=MO.map((mo,i)=>`<text x="${(px+i*slot+slot/2).toFixed(1)}" y="${H-2}" text-anchor="middle" font-size="8" fill="${i===S.month?'#5b7f6b':'#a39686'}">${mo[0]}</text>`).join('');
  const legend=S.cats.map(cat=>`<div style="display:flex;align-items:center;gap:3px"><div style="width:6px;height:6px;border-radius:2px;background:${cat.color}"></div><span style="font-size:9px;color:#7d7265">${cat.name}</span></div>`).join('');

}
function rSparklines(){
  const idxs=Array.from({length:6},(_,i)=>(S.month-5+i+12)%12);
  const items=S.cats.map(cat=>{
    const vals=idxs.map(m=>ct(m,cat.id));
    const max=Math.max(...vals,1);
    const W=80,H=30;
    const pts=vals.map((v,i)=>`${(4+i*14).toFixed(0)},${(H-4-(v/max)*(H-8)).toFixed(1)}`).join(' ');
    const curr=vals[5],prev=vals[4];
    let tr='';
    if(prev&&curr){const p=Math.round(((curr-prev)/prev)*100);if(p>5)tr=`<span style="font-size:9px;color:#cf5a3e">&#9650;${p}%</span>`;else if(p<-5)tr=`<span style="font-size:9px;color:#4f8a68">&#9660;${Math.abs(p)}%</span>`;}
    return`<div style="background:#fffdf9;border-radius:8px;padding:6px 7px 5px;border:1px solid #ece4d8">
      <div style="display:flex;align-items:center;gap:3px;margin-bottom:3px">

      </div>
      <svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" style="display:block">
        <polyline points="${pts}" fill="none" stroke="${cat.color}" stroke-width="1.5" stroke-linejoin="round"/>
        ${vals.map((v,i)=>`<circle cx="${(4+i*14).toFixed(0)}" cy="${(H-4-(v/max)*(H-8)).toFixed(1)}" r="${i===5?2.5:1.5}" fill="${cat.color}"/>`).join('')}

function rIncVsExp(){

  const lbls=idxs.map((m,i)=>`<text x="${(px+i*slot+slot/2).toFixed(1)}" y="${H-2}" text-anchor="middle" font-size="9" fill="${m===S.month?'#5b7f6b':'#a39686'}">${MO[m].substring(0,3)}</text>`).join('');

// Maaser: a tenth of the month's income, minus what was given (the "צדקה" category)
function maaserOf(m){const inc=incT(m),due=Math.round(inc/10),given=ct(m,charityCat()?.id);return{inc,due,given,left:due-given};}
function rMaaser(){
  const r=maaserOf(S.month);
  let yDue=0,yGiven=0;for(let m=0;m<12;m++){const x=maaserOf(m);yDue+=x.due;yGiven+=x.given;}
  const yLeft=yDue-yGiven;
  const row=(l,v,c='#2f2a24',b=400)=>`<div style="display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #f3ece2"><span style="color:#7d7265;font-size:14px">${l}</span><span style="font-weight:${b};color:${c};font-size:15px">&#8362;${fm(v)}</span></div>`;

  ih("m2",`<div class="overlay" id="maO"><div class="modal">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">
      <span style="font-size:17px;font-weight:800;color:#2f2a24">&#129518; מעשר — ${moLabel(S.month)}</span>
      <button id="maX" style="background:#f3ece2;border:none;border-radius:50%;width:32px;height:32px;cursor:pointer;font-size:18px;color:#7d7265">&times;</button>
    </div>
    ${row('הכנסות החודש',r.inc)}
    ${row('מעשר (10%)',r.due,'#2f2a24',700)}
    ${row('ניתן לצדקה',r.given,'#b56b7c')}
    <div style="text-align:center;background:${r.left>0?'#f8eef0':'#eef5ef'};border-radius:14px;padding:14px;margin:14px 0">${verdict(r.left)}</div>
    <div style="display:flex;gap:8px;margin-bottom:14px">
      <input class="inp" id="maAmt" type="number" inputmode="decimal" min="0" placeholder="סכום שנתתי" value="${r.left>0?r.left:''}" style="flex:1;padding:10px 12px;font-size:16px;text-align:center"/>
      <button id="maGive" style="padding:10px 16px;border-radius:10px;border:none;color:#fff;font-weight:800;font-size:14px;background:linear-gradient(135deg,#b56b7c,#9e5868);cursor:pointer;white-space:nowrap">&#10004; נתתי</button>
    </div>
    <div style="font-size:12px;color:#a39686;text-align:center">מתחילת ${S.year}: מעשר &#8362;${fm(yDue)} · ניתן &#8362;${fm(yGiven)} · ${yLeft>0?'להשלים &#8362;'+fm(yLeft):yLeft<0?'עודף &#8362;'+fm(-yLeft):'מאוזן'}</div>
  </div></div>`);
  g("maX").onclick=()=>ih("m2","");
  // Record a donation as an entry in this month's "צדקה" category
  g("maGive").onclick=()=>{
    const a=Math.round((parseFloat(g("maAmt").value)||0)*100)/100;if(a<=0){g("maAmt").focus();return;}
    const c=charityCat();if(!c)return;
    const p=todayPeriod(),date=(p.month===S.month&&p.year===S.year)?today():adjDate(today(),S.month,S.year);
    if(!S.mData[S.month][c.id])S.mData[S.month][c.id]={entries:[]};
    S.mData[S.month][c.id].entries.push({id:Date.now(),desc:'מעשר',amount:a,date,recurring:false,subCat:null});
    sv();rMon();rMaaser();
  };
  g("maAmt").onkeydown=e=>{if(e.key==="Enter")g("maGive").click();};
  g("maO").onclick=e=>{if(e.target.id==="maO")ih("m2","");};
}
// Progress bar color by how much of the budget is used: blue, orange from 80%, red from 100%
function barColor(p){return p>=100?'#d1453b':p>=80?'#e48a2f':'#4a7fc1';}
function rMon(){
  const {month:nowM,year:nowY}=todayPeriod();
  const isNow=S.month===nowM&&S.year===nowY;
  const filt=S.expFilter||'all';

  const monNav=`<div class="monNav" style="display:flex;align-items:center;justify-content:space-between;margin:0 -16px 12px;padding:4px 18px 12px">

    <div style="text-align:center;line-height:1.15">
      <span style="font-size:26px;font-weight:700;color:#2f2a24;letter-spacing:-.4px">${moLabel(S.month)}</span><span style="font-size:13px;color:#8a7f72;margin-inline-start:6px">${S.year}</span>
      ${cycleRangeLabel(S.month)?`<div style="font-size:11px;color:#a39686">${cycleRangeLabel(S.month)}</div>`:''}
      ${!isNow?'<button id="todayBtn" style="margin-top:4px;padding:3px 10px;border-radius:8px;border:none;background:#e9f0eb;color:#5b7f6b;font-size:11.5px;font-weight:600;cursor:pointer">&#8617; לחודש הנוכחי</button>':''}

  const card='background:#fffdf9;border:1px solid #ece4d8;border-radius:24px;box-shadow:0 6px 20px rgba(90,70,40,.06)';
  // Total monthly budget = every category active this month (regular + recurring budget)
  const budCats=S.cats.filter(c=>!c.activeMonths||c.activeMonths.includes(S.month));
  const totBud=budCats.reduce((t,c)=>t+(c.budget||0)+(c.budgetRec||0),0);
  const budLeft=totBud-expTotal,budOv=totBud>0&&expTotal>totBud,budPct=totBud>0?Math.min(100,expTotal/totBud*100):0;
  const mini=(l,v,c,extra='')=>`<div ${extra} style="flex:1;min-width:0;background:#f7f1e8;border-radius:14px;padding:9px 10px;${extra?'cursor:pointer':''}"><div style="font-size:11.5px;color:#8a7f72">${l}</div><div style="font-size:15px;font-weight:700;color:${c};margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${v}</div></div>`;

    return`<div data-catid="${cat.id}" style="padding:14px 16px;border-bottom:1px solid #f0e8dc">

      ${bud>0?`<div style="height:5px;border-radius:5px;background:#efe7db;margin-top:11px;overflow:hidden"><div style="height:100%;width:${pct}%;background:${barC};border-radius:5px"></div></div>
      <div style="display:flex;justify-content:space-between;font-size:11.5px;color:#8a7f72;margin-top:6px"><span>${ov?'חריגה של &#8362;'+fm(-rem):'נותרו &#8362;'+fm(rem)}</span><span>${Math.round(tot/bud*100)}%</span></div>`:''}
      ${mz&&mz.due>0?`<div style="font-size:11.5px;color:${mz.left>0?'#9e5868':'#4a6b58'};margin-top:6px">${mz.left>0?'מעשר: נשאר להשלים &#8362;'+fm(mz.left):'המעשר הושלם &#10004;'}</div>`:''}
      ${(cat.subs||[]).some(s=>s.budget>0)?`<div style="border-top:1px solid #f3ece2;margin-top:8px;padding-top:6px">${(cat.subs||[]).filter(s=>s.budget>0).map(s=>{const sT=ent.filter(e=>e.subCat===s.id).reduce((a,e)=>a+(parseFloat(e.amount)||0),0);const sP=Math.min((sT/s.budget)*100,100);const sOv=sT>s.budget;return`<div style="display:flex;align-items:center;gap:6px;margin-bottom:3px"><span style="font-size:11px;color:#7d7265;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${s.name}</span><span style="font-size:11px;font-weight:600;color:${sOv?'#cf5a3e':'#5b7f6b'};flex-shrink:0">&#8362;${fm(sT)}</span><div style="width:48px;height:4px;background:#f3ece2;border-radius:2px;overflow:hidden;flex-shrink:0"><div style="height:100%;width:${sP}%;background:${barColor(sP)};border-radius:2px"></div></div><span style="font-size:10px;color:#a39686;flex-shrink:0">${fm(s.budget)}</span></div>`;}).join('')}</div>`:''}
    </div>`;
  }).join("");

  // Event cards for this month (paid expenses only)
  const evtCards=EVENTS.map(ev=>{
    const monthExps=(ev.expenses||[]).flatMap(e=>{const ps=evPays(e),part=ps.length>1||(!e.paid&&ps.length);
      return ps.filter(p=>expCycleMonth(p.date)===S.month).map(p=>({desc:e.desc+(part?' (תשלום)':''),amount:p.amt,date:p.date}));});
    if(!monthExps.length)return'';
    const tot=monthExps.reduce((s,e)=>s+(parseFloat(e.amount)||0),0);
    return`<div style="padding:14px 16px;border-bottom:1px solid #f0e8dc">
      <div style="display:flex;align-items:center;gap:11px">

      ${monthExps.map(e=>`<div style="display:flex;gap:6px;font-size:12px;color:#8a7f72;margin-top:6px;padding-inline-start:47px"><span style="flex:1">${e.desc}</span>${e.date?`<span>${fmDate(e.date)}</span>`:''}<span style="font-weight:600;color:#2f2a24">&#8362;${fm(e.amount)}</span></div>`).join('')}

    const e=S.mData[S.month]?.[c.id]?.entries||[];

  const cc=g("chartCarousel");
  if(cc){let _cx=0,_cy=0;cc.addEventListener("touchstart",e=>{_cx=e.touches[0].clientX;_cy=e.touches[0].clientY;},{passive:true});cc.addEventListener("touchend",e=>{const dx=_cx-e.changedTouches[0].clientX,dy=Math.abs(_cy-e.changedTouches[0].clientY);if(Math.abs(dx)>40&&dy<80){if(dx>0)S.chartIdx=Math.max(S.chartIdx-1,0);else S.chartIdx=Math.min(S.chartIdx+1,3);rMon();}},{passive:true});}

  document.querySelectorAll(".oE").forEach(b=>b.onclick=()=>{S.aCat=parseInt(b.dataset.c);S.editEntId=null;rEntMod();});

  document.querySelectorAll(".dC").forEach(b=>b.onclick=e=>{e.stopPropagation();if(charityCat()?.id===parseInt(b.dataset.c)){alert('קטגוריית צדקה מובנית (משמשת לחישוב המעשר) ולא ניתן למחוק אותה');return;}if(confirm("למחוק?")){S.cats=S.cats.filter(c=>c.id!==parseInt(b.dataset.c));sv();rMon();}});

          <input class="inp" id="expInst" type="number" min="1" max="60" placeholder="1" style="text-align:center;font-size:18px;font-weight:700;color:#5b7f6b" value="${_inst}"/>
        </div>
        <div style="flex:2;padding-bottom:2px;font-size:11px;color:#a39686;line-height:1.5">פיצול לחודשים עוקבים<br/>(1 = ללא פיצול)</div>
      </div>
      <label style="display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;background:#faf6ef;border:1px solid #ece4d8;cursor:pointer;margin-bottom:16px">
        <input type="checkbox" id="expRec" style="width:18px;height:18px;accent-color:#5b7f6b;flex-shrink:0" ${_rec?'checked':''}/>
        <div style="flex:1">
          <div style="font-size:13px;font-weight:700;color:#2f2a24">הוצאה קבועה</div>
          <div style="font-size:11px;color:#a39686">תתוסף אוטומטית לכל החודשים</div>
        </div>
        <span style="font-size:22px">&#128260;</span>
      </label>
      <div style="position:sticky;bottom:-24px;background:#fffdf9;padding:10px 0 0;margin:8px -24px -24px;padding:10px 24px 20px;border-top:1px solid #f3ece2">
        <button id="expSave" style="width:100%;padding:14px;border-radius:12px;border:none;color:#fff;font-weight:800;font-size:15px;background:linear-gradient(135deg,#5b7f6b,#6f9480);cursor:pointer;box-shadow:0 4px 14px rgba(91,127,107,.3)">שמור הוצאה</button>
      </div>
    </div></div>`);
    g("cExp").onclick=()=>ih("m1","");
    g("expO").onclick=e=>{if(e.target.id==="expO")ih("m1","");};
    g("expSave").onclick=()=>{
      const a=parseFloat(g("expA").value);
      if(!a){g("expA").focus();return;}
      if(!selCat)return;
      const desc=(g("expD").value||"").trim();
      const date=g("expDt").value||today();
      const isRec=g("expRec").checked;
      const inst=Math.max(1,parseInt(g("expInst").value)||1);
      const baseId=Date.now();
      const subCat=selSub||null;
      // The entered date decides the (first) month, not the month on screen
      const b=dateBucket(date);
      if(b.y===S.year)S.month=b.m;
      if(isRec){
        for(let m=S.month;m<12;m++){
          S.mData[m][selCat].entries.push({id:baseId+m*1000,desc,amount:a,date:bucketDate(date,S.year,m),recurring:true,subCat});
        }
        sv();
        applyToFutureYears(baseId,selCat,(entries,relId,m,fy)=>{
          if(entries.some(e=>e.id===relId))return undefined;
          return[...entries,{id:relId,desc,amount:a,date:adjDate(date,m,fy),recurring:true,subCat}];
        });
      } else if(inst>1){
        const perMonth=Math.round(a/inst*100)/100,later={};
        for(let i=0;i<inst;i++){
          const abs=b.y*12+b.m+i,tMonth=abs%12,tYear=Math.floor(abs/12);
          const entryDate=bucketDate(date,tYear,tMonth);
          const entryDesc=desc?(desc+' ('+(i+1)+'/'+inst+')'):(''+(i+1)+'/'+inst);
          if(tYear===S.year){
            if(!S.mData[tMonth])S.mData[tMonth]={};
            if(!S.mData[tMonth][selCat])S.mData[tMonth][selCat]={entries:[]};
            S.mData[tMonth][selCat].entries.push({id:baseId+i*1000,desc:entryDesc,amount:perMonth,date:entryDate,recurring:false,subCat,inst:{base:baseId,n:inst,i}});
          } else {
            (later[tYear]=later[tYear]||[]).push({m:tMonth,e:{id:baseId+i*1000,desc:entryDesc,amount:perMonth,date:entryDate,recurring:false,subCat,inst:{base:baseId,n:inst,i}}});
          }
        }
        sv();
        Object.keys(later).forEach(y=>editYear(+y,d=>{
          later[y].forEach(({m,e})=>{if(!d.mData[m])d.mData[m]={income:[]};if(!d.mData[m][selCat])d.mData[m][selCat]={entries:[]};d.mData[m][selCat].entries.push(e);});
          if(!d.cats.find(c=>c.id===selCat)){const c=S.cats.find(c=>c.id===selCat);if(c)d.cats.push({...c});}
        }));
      } else if(b.y===S.year){
        S.mData[b.m][selCat].entries.push({id:baseId,desc,amount:a,date,recurring:false,subCat});
        sv();
      } else {
        editYear(b.y,d=>{
          if(!d.mData[b.m])d.mData[b.m]={income:[]};if(!d.mData[b.m][selCat])d.mData[b.m][selCat]={entries:[]};
          d.mData[b.m][selCat].entries.push({id:baseId,desc,amount:a,date,recurring:false,subCat});
          if(!d.cats.find(c=>c.id===selCat)){const c=S.cats.find(c=>c.id===selCat);if(c)d.cats.push({...c});}
        });
      }
      ih("m1","");rMon();
    };
    g("expA").onkeydown=e=>{if(e.key==="Enter")g("expSave").click();};
    document.querySelectorAll(".expCat").forEach(b=>b.onclick=()=>{
      _desc=(g("expD")?.value||"");_amt=(g("expA")?.value||"");_date=(g("expDt")?.value||today());_rec=(g("expRec")?.checked||false);_inst=parseInt(g("expInst")?.value)||1;
      selCat=parseInt(b.dataset.c);selSub=null;build();
      requestAnimationFrame(()=>{const el=g("expA");if(el)el.focus();});
    });
    document.querySelectorAll(".expSub").forEach(b=>b.onclick=()=>{
      _desc=(g("expD")?.value||"");_amt=(g("expA")?.value||"");_date=(g("expDt")?.value||today());_rec=(g("expRec")?.checked||false);_inst=parseInt(g("expInst")?.value)||1;
      const sid=parseInt(b.dataset.s);selSub=selSub===sid?null:sid;build();
    });
  }
  build();
}

  ih("m1",`<div class="overlay" id="incO"><div class="modal">

    </div>

    ${inc.length>0?`<div style="margin-top:10px;border-top:1px solid #ece4d8;padding-top:10px;display:flex;justify-content:space-between"><span style="color:#a39686;font-size:12px">${inc.length} הכנסות</span><span style="font-weight:700;color:#3f7356">&#8362;${fm(tot)}</span></div>`:""}
  </div></div>`);
  g("cInc").onclick=()=>{ih("m1","");rMon();};
  g("incO").onclick=e=>{if(e.target.id==="incO"){ih("m1","");rMon();}};
  g("incShow").onclick=()=>{g("incShow").style.display='none';g("incForm").style.display='flex';g("iA").focus();};
  g("iA").onkeydown=e=>{if(e.key==="Enter")g("iAdd").click();};

    const a=parseFloat(g("iA").value);if(!a)return;
    if(!S.mData[S.month].income)S.mData[S.month].income=[];
    S.mData[S.month].income.push({id:Date.now(),desc:(g("iD").value||"").trim(),amount:a,date:g("iDt").value||today()});
    sv();rIncMod();
  };
  document.querySelectorAll(".dInc").forEach(b=>b.onclick=()=>{
    S.mData[S.month].income=S.mData[S.month].income.filter(e=>e.id!==parseInt(b.dataset.e));

    <table><thead><tr><th style="text-align:right;padding:10px;font-size:12px">קטגוריה</th>${hd}<th style="color:#5b7f6b;font-size:11px">סה&quot;כ</th></tr></thead>
    <tbody>${rows}

function rEntMod(){
  const cat=S.cats.find(c=>c.id===S.aCat);if(!cat)return;
  const allEntMod=S.mData[S.month]?.[S.aCat]?.entries||[];
  const entFilt=S.expFilter||'all';
  const ent=entFilt==='all'?allEntMod:entFilt==='recurring'?allEntMod.filter(e=>e.recurring):allEntMod.filter(e=>!e.recurring);
  const tot=ent.reduce((s,e)=>s+(parseFloat(e.amount)||0),0);
  const variableEntTot=allEntMod.filter(e=>!e.recurring).reduce((s,e)=>s+(parseFloat(e.amount)||0),0);
  const rem=cat.budget-variableEntTot,ov=variableEntTot>cat.budget&&cat.budget>0;
  const pct=cat.budget>0?Math.min((variableEntTot/cat.budget)*100,100):0;
  const q=(g("entSearch")?.value||"").trim().toLowerCase();
  const filtered=q?ent.filter(e=>(e.desc||"").toLowerCase().includes(q)):ent;
  const sorted=[...filtered].sort((a,b)=>S.sortEnt==="amount"?(parseFloat(b.amount)||0)-(parseFloat(a.amount)||0):(b.date||"")>(a.date||"")?1:-1);

  const subBreakdown=cat.subs?.length?`<div style="background:#faf6ef;border-radius:9px;padding:10px 12px;margin-bottom:10px;border:1px solid #ece4d8"><div style="font-size:11px;font-weight:700;color:#7d7265;margin-bottom:6px">&#128202; פילוח תתי-קטגוריות</div>${cat.subs.map(sub=>{const curr=ent.filter(e=>e.subCat===sub.id).reduce((s,e)=>s+(parseFloat(e.amount)||0),0);const pEnt=S.mData[(S.month-1+12)%12]?.[S.aCat]?.entries||[];const prev=pEnt.filter(e=>e.subCat===sub.id).reduce((s,e)=>s+(parseFloat(e.amount)||0),0);let tr='';if(prev&&curr){const pt=Math.round(((curr-prev)/prev)*100);if(pt>5)tr=`<span style="font-size:10px;color:#cf5a3e">&#9650;${pt}%</span>`;else if(pt<-5)tr=`<span style="font-size:10px;color:#4f8a68">&#9660;${Math.abs(pt)}%</span>`;}return`<div style="display:flex;align-items:center;gap:6px;padding:4px 0;border-bottom:1px solid #f3ece2"><span style="font-size:12px;color:#7d7265;flex:1">${sub.name}</span>${tr}<span style="font-size:13px;font-weight:700;color:#2f2a24">&#8362;${fm(curr)}</span></div>`;}).join('')}</div>`:'';

  const subSel=cat.subs?.length?`<div style="display:flex;align-items:center;gap:8px;margin-bottom:8px"><span style="font-size:11px;color:#a39686;white-space:nowrap">תת-קטגוריה:</span><select class="inp" id="mSub" style="flex:1;padding:6px 8px;font-size:12px"><option value="">כללי</option>${cat.subs.map(s=>`<option value="${s.id}">${s.name}</option>`).join('')}</select></div>`:'';

  const list=sorted.length===0
    ?`<div style="text-align:center;color:#d6ccbe;font-size:14px;padding:24px 0">${q?"אין תוצאות":"אין הוצאות עדיין"}</div>`
    :sorted.map((e,i)=>{
      if(S.editEntId===e.id){
        return`<div style="padding:9px 10px;border-radius:9px;background:#e9f0eb;margin-bottom:3px;border:1px solid #c9d9ce">
          <div style="display:flex;gap:5px;margin-bottom:4px;flex-wrap:wrap">
            <input class="inp" id="ed_desc" value="${(e.desc||"").replace(/"/g,'&quot;')}" placeholder="תיאור" style="flex:2;min-width:100px;padding:6px 8px;font-size:12px"/>
            <input class="inp" id="ed_amt" type="number" value="${e.amount}" style="flex:1;min-width:70px;padding:6px 8px;font-size:13px;font-weight:700"/>
            <input class="inp" id="ed_date" type="date" value="${e.date||today()}" style="flex:1;min-width:100px;padding:6px 4px;font-size:11px"/>
          </div>
          ${instInfo(e)?`<div style="font-size:11px;color:#5b7f6b;margin-bottom:4px">&#128179; ישנה את כל ${instInfo(e).n} התשלומים (סכום לתשלום)</div>`:''}
          ${cat.subs?.length?`<div style="margin-bottom:4px"><select class="inp" id="ed_sub" style="width:100%;padding:6px 8px;font-size:12px"><option value="">כללי</option>${cat.subs.map(s=>`<option value="${s.id}"${e.subCat===s.id?' selected':''}>${s.name}</option>`).join('')}</select></div>`:''}
          <div style="display:flex;gap:5px">
            <button class="saveEnt" data-e="${e.id}" style="flex:1;padding:6px;border-radius:8px;border:none;color:#fff;background:#5b7f6b;font-size:12px;cursor:pointer">שמור</button>
            <button onclick="window.S.editEntId=null;window.rEntMod()" style="flex:1;padding:6px;border-radius:8px;border:none;color:#7d7265;background:#f3ece2;font-size:12px;cursor:pointer">ביטול</button>
          </div>
        </div>`;
      }
      const subObj=cat.subs?.find(s=>s.id===e.subCat);
      return`<div style="display:flex;align-items:center;gap:6px;padding:9px 10px;border-radius:9px;background:${i%2===0?'#faf6ef':'#fff'};margin-bottom:3px;border-right:${e.recurring?'3px solid #5b7f6b':'3px solid transparent'}">
        <span style="font-size:11px;color:#a39686;flex-shrink:0;min-width:32px">${fmDate(e.date)}</span>
        ${e.recurring?'<span style="font-size:13px" title="הוצאה קבועה">&#128260;</span>':''}
        ${subObj?`<span style="font-size:10px;background:#e9f0eb;color:#5b7f6b;border-radius:6px;padding:1px 6px;flex-shrink:0">${subObj.name}</span>`:''}
        <span style="font-size:13px;color:#7d7265;flex:1">${e.desc||'—'}</span>
        <span style="font-size:14px;font-weight:700;color:#2f2a24">&#8362;${fm(e.amount)}</span>
        <button class="editEnt" data-e="${e.id}" style="background:transparent;border:none;cursor:pointer;font-size:13px;color:#5b7f6b;padding:3px">&#9998;</button>
        <button class="dEn" data-e="${e.id}" style="background:transparent;border:none;cursor:pointer;font-size:15px;color:#cf5a3e;padding:3px">&#128465;</button>
      </div>`;
    }).join("");

  ih("m1",`<div class="overlay" id="eO"><div class="modal">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
      <div style="display:flex;align-items:center;gap:8px"><div style="width:9px;height:9px;border-radius:50%;background:${cat.color}"></div><span style="font-size:16px;font-weight:800;color:#2f2a24">${cat.name}</span><span style="font-size:12px;color:#a39686">${moLabel(S.month)}</span></div>
      <button id="cE" style="background:#f3ece2;border:none;border-radius:50%;width:32px;height:32px;cursor:pointer;font-size:18px;color:#7d7265">&times;</button>
    </div>
    <div style="display:flex;gap:6px;margin-bottom:8px">
      <div style="flex:1;background:#faf6ef;border-radius:9px;padding:9px;text-align:center;border:1px solid #ece4d8"><div style="font-size:10px;color:#a39686;margin-bottom:2px">תקציב</div><div style="font-size:15px;font-weight:700;color:#5b7f6b">${cat.budget}</div></div>
      <div style="flex:1;background:#faf6ef;border-radius:9px;padding:9px;text-align:center;border:1px solid #ece4d8"><div style="font-size:10px;color:#a39686;margin-bottom:2px">הוצאה</div><div style="font-size:15px;font-weight:700;color:${ov?'#cf5a3e':'#2f2a24'}">&#8362;${fm(tot)}</div></div>
      <div style="flex:1;background:#faf6ef;border-radius:9px;padding:9px;text-align:center;border:1px solid #ece4d8"><div style="font-size:10px;color:#a39686;margin-bottom:2px">יתרה</div><div style="font-size:15px;font-weight:700;color:${rem<0?'#cf5a3e':'#4f8a68'}">${rem<0?fm(Math.abs(rem))+'-&#8362;':'&#8362;'+fm(rem)}</div></div>
    </div>
    <div style="height:5px;background:#f3ece2;border-radius:3px;margin-bottom:10px;overflow:hidden"><div style="height:100%;width:${pct}%;background:${barColor(pct)};border-radius:3px"></div></div>
    ${subBreakdown}
    <div style="display:flex;gap:6px;margin-bottom:8px">
      <input class="inp" id="entSearch" placeholder="&#128269; חיפוש..." style="flex:1;padding:7px 10px;font-size:12px" value="${q}"/>
      <button id="sortBtn" style="padding:7px 10px;border-radius:8px;border:1px solid #ece4d8;background:#fffdf9;color:#7d7265;font-size:11px;cursor:pointer;white-space:nowrap">מיון: ${S.sortEnt==="date"?"תאריך":"סכום"}</button>
    </div>
    <div style="max-height:230px;overflow-y:auto">${list}</div>
    ${ent.length>0?`<div style="margin-top:10px;border-top:1px solid #ece4d8;padding-top:10px;display:flex;justify-content:space-between;align-items:center"><span style="color:#a39686;font-size:12px">${ent.length} פריטים</span><span style="font-weight:700;font-size:14px;color:${ov?'#cf5a3e':'#5b7f6b'}">&#8362;${fm(tot)}</span></div>`:""}
  </div></div>`);

  g("cE").onclick=()=>{ih("m1","");S.editEntId=null;rMon();};
  g("eO").onclick=e=>{if(e.target.id==="eO"){ih("m1","");S.editEntId=null;rMon();}};
  g("entSearch").oninput=()=>rEntMod();
  g("sortBtn").onclick=()=>{S.sortEnt=S.sortEnt==="date"?"amount":"date";rEntMod();};
  document.querySelectorAll(".editEnt").forEach(b=>b.onclick=()=>{S.editEntId=parseInt(b.dataset.e);rEntMod();});
  document.querySelectorAll(".saveEnt").forEach(b=>b.onclick=()=>{
    const id=parseInt(b.dataset.e),a=parseFloat(g("ed_amt").value);if(!a)return;
    const desc=(g("ed_desc").value||"").trim(),date=g("ed_date").value||today();
    const subEl=g("ed_sub");
    const subCat=subEl&&subEl.value?parseInt(subEl.value):null;
    const entry=S.mData[S.month][S.aCat].entries.find(e=>e.id===id);
    if(entry?.recurring){
      const bid=id-S.month*1000;
      for(let m=S.month;m<12;m++){
        const relId=bid+m*1000;
        if(S.mData[m]?.[S.aCat])S.mData[m][S.aCat].entries=S.mData[m][S.aCat].entries.map(e=>e.id===relId?{...e,desc,amount:a,date:adjDate(date,m,S.year),subCat}:e);
      }
      sv();
      applyToFutureYears(bid,S.aCat,(entries,relId,m,fy)=>{
        if(!entries.some(e=>e.id===relId))return undefined;
        return entries.map(e=>e.id===relId?{...e,desc,amount:a,date:adjDate(date,m,fy),subCat}:e);
      });
    }else if(instInfo(entry)){
      const n=instInfo(entry).n,b=instBase(desc);
      forInstSeries(entry,S.aCat,(x,k,y,m)=>({...x,desc:instDesc(b,k+1,n),amount:a,date:bucketDate(date,y,m),subCat}));
    }else{
      S.mData[S.month][S.aCat].entries=S.mData[S.month][S.aCat].entries.map(e=>e.id===id?{...e,desc,amount:a,date,subCat}:e);
      sv();
    }
    S.editEntId=null;rEntMod();
  });
  document.querySelectorAll(".dEn").forEach(b=>b.onclick=()=>{
    const id=parseInt(b.dataset.e);
    const entry=S.mData[S.month][S.aCat].entries.find(e=>e.id===id);
    if(entry?.recurring){
      const bid=id-S.month*1000;
      for(let m=S.month;m<12;m++){
        const relId=bid+m*1000;
        if(S.mData[m]?.[S.aCat])S.mData[m][S.aCat].entries=S.mData[m][S.aCat].entries.filter(e=>e.id!==relId);
      }
      sv();
      applyToFutureYears(bid,S.aCat,(entries,relId)=>{
        if(!entries.some(e=>e.id===relId))return undefined;
        return entries.filter(e=>e.id!==relId);
      });
    }else if(instInfo(entry)){
      const n=instInfo(entry).n;
      if(!confirm('זו עסקה בתשלומים ('+(instInfo(entry).i+1)+'/'+n+'). למחוק את כל '+n+' התשלומים?'))return;
      forInstSeries(entry,S.aCat,()=>null);
    }else{
      S.mData[S.month][S.aCat].entries=S.mData[S.month][S.aCat].entries.filter(e=>e.id!==id);
      sv();
    }
    rEntMod();
  });
}

function isUnlocked(uid){try{return!!localStorage.getItem('bdg_unlocked_'+(uid||CUR_UID));}catch{return false;}}
function setUnlocked(uid){GATE=false;try{localStorage.setItem('bdg_unlocked_'+(uid||CUR_UID),'1');}catch{}}

function canUseBiometric(){return!!(window.PublicKeyCredential&&navigator.credentials&&window.isSecureContext);}
function hasBiometric(uid){try{return!!localStorage.getItem('bdg_cred_'+(uid||CUR_UID));}catch{return false;}}
async function registerBiometric(uid,onOk,onFail){
  if(!canUseBiometric()){onFail&&onFail('לא נתמך');return;}
  try{
    const ch=crypto.getRandomValues(new Uint8Array(32));
    const u8=new TextEncoder().encode(uid||CUR_UID);
    const c=await navigator.credentials.create({publicKey:{
      challenge:ch,
      rp:{name:'תקציב משפחתי',id:window.location.hostname||'localhost'},
      user:{id:u8,name:uid||CUR_UID,displayName:USERS.find(u=>u.id===(uid||CUR_UID))?.name||''},
      pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],
      authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required',residentKey:'discouraged'},
      timeout:60000
    }});
    if(!c){onFail&&onFail();return;}
    localStorage.setItem('bdg_cred_'+(uid||CUR_UID),btoa(String.fromCharCode(...new Uint8Array(c.rawId))));
    onOk&&onOk();
  }catch(e){console.warn('regBio:',e);onFail&&onFail(e?.message);}
}
async function authBiometric(uid,onOk,onFail){
  if(!canUseBiometric()||!hasBiometric(uid)){onFail&&onFail();return;}
  try{
    const idB64=localStorage.getItem('bdg_cred_'+(uid||CUR_UID));
    const idBytes=Uint8Array.from(atob(idB64),c=>c.charCodeAt(0));
    await navigator.credentials.get({publicKey:{
      challenge:crypto.getRandomValues(new Uint8Array(32)),
      rpId:window.location.hostname||'localhost',
      allowCredentials:[{id:idBytes,type:'public-key'}],
      userVerification:'required',
      timeout:60000
    }});
    onOk&&onOk();
  }catch(e){console.warn('authBio:',e);onFail&&onFail();}
}

function rLockScreen(showPin=false){
  const u=USERS.find(u=>u.id===CUR_UID);
  if(!u?.pin||isUnlocked(CUR_UID)){GATE=false;rAll();return;}
  GATE=true;
  const cnt=g('cnt');
  const useBio=canUseBiometric()&&hasBiometric(CUR_UID);
  const pinMode=showPin||!useBio;
  cnt.innerHTML=`<div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:32px 24px">

    <div style="font-size:22px;font-weight:800;color:#2f2a24">${u.name}</div>
    <div style="font-size:13px;color:#a39686">${pinMode?'הזן סיסמה כדי להמשיך':'ממתין לאימות ביומטרי'}</div>
    ${pinMode?`
    <input class="inp" id="lockPin" type="password" placeholder="סיסמה" style="text-align:center;font-size:22px;letter-spacing:8px;max-width:220px"/>
    <button id="lockEnter" style="padding:13px;border-radius:12px;border:none;color:#fff;font-weight:800;font-size:15px;background:linear-gradient(135deg,#5b7f6b,#6f9480);cursor:pointer;width:100%;max-width:220px;box-shadow:0 4px 14px rgba(91,127,107,.3)">כניסה</button>
    <div id="lockErr" style="color:#cf5a3e;font-size:12px;display:none">&#10060; סיסמה שגויה</div>`:''}
    ${!pinMode?`<button id="lockBio" style="padding:12px 24px;border-radius:12px;border:2px solid #c9d9ce;color:#5b7f6b;font-weight:700;font-size:14px;background:#e9f0eb;cursor:pointer">נסה שוב</button>`:''}
    ${useBio&&pinMode?`<button id="lockBioSwitch" style="background:transparent;border:none;color:#5b7f6b;font-size:13px;cursor:pointer;text-decoration:underline">&#128400; עבור לטביעת אצבע</button>`:''}
    ${!pinMode?`<button id="lockPinSwitch" style="background:transparent;border:none;color:#a39686;font-size:13px;cursor:pointer;text-decoration:underline">השתמש בסיסמה במקום</button>`:''}
    ${USERS.length>1?`<button id="lockSwitch" style="background:transparent;border:none;color:#a39686;font-size:13px;cursor:pointer;margin-top:4px;text-decoration:underline">כניסה עם משתמש אחר</button>`:''}
  </div>`;
  if(USERS.length>1&&g('lockSwitch'))g('lockSwitch').onclick=()=>rPickUser();
  if(pinMode){
    const tryPin=()=>{
      if(g('lockPin').value===u.pin){setUnlocked(CUR_UID);rAll();}
      else{g('lockErr').style.display='block';g('lockPin').value='';g('lockPin').focus();}
    };
    g('lockEnter').onclick=tryPin;
    g('lockPin').onkeydown=e=>{if(e.key==='Enter')tryPin();};
    if(g('lockBioSwitch'))g('lockBioSwitch').onclick=()=>rLockScreen(false);
    requestAnimationFrame(()=>{const el=g('lockPin');if(el)el.focus();});
  }else{
    const bioOk=()=>{setUnlocked(CUR_UID);rAll();};
    const bioFail=()=>{if(g('lockBio'))g('lockBio').disabled=false;};
    if(g('lockBio'))g('lockBio').onclick=()=>{g('lockBio').disabled=true;authBiometric(CUR_UID,bioOk,bioFail);};
    if(g('lockPinSwitch'))g('lockPinSwitch').onclick=()=>rLockScreen(true);
    authBiometric(CUR_UID,bioOk,()=>rLockScreen(true));
  }
}

function rBudgetSuggest(){
  const N=6;
  const months=[];
  // i=0 = current month, up to N-1 months back
  for(let i=0;i<N;i++){
    const offset=S.month-i;
    const m=((offset%12)+12)%12;
    const y=S.year+Math.floor(offset/12);
    let ents={},inc=0;
    if(y===S.year){
      S.cats.forEach(c=>{ents[c.id]=S.mData[m]?.[c.id]?.entries||[];});
      inc=incT(m);
    }else{
      try{const d=JSON.parse(localStorage.getItem('bdg_v4_'+CUR_UID+'_'+y)||'{}');S.cats.forEach(c=>{ents[c.id]=d.mData?.[m]?.[c.id]?.entries||[];});inc=(d.mData?.[m]?.income||[]).reduce((s,e)=>s+(parseFloat(e.amount)||0),0);}catch{}
    }
    months.push({m,y,ents,inc});
  }
  const r50=n=>n>0?Math.ceil(n/50)*50:0;
  const incomes=months.map(mo=>mo.inc).filter(v=>v>0);
  const avgInc=incomes.length?incomes.reduce((a,b)=>a+b,0)/incomes.length:0;
  const MAX_RATIO=0.8;
  const sugs=S.cats.map(cat=>{
    const varA=months.map(mo=>mo.ents[cat.id].filter(e=>!e.recurring).reduce((s,e)=>s+(parseFloat(e.amount)||0),0));
    const recA=months.map(mo=>mo.ents[cat.id].filter(e=>e.recurring).reduce((s,e)=>s+(parseFloat(e.amount)||0),0));
    const avgVar=varA.length?varA.reduce((a,b)=>a+b,0)/varA.length:0;
    const avgRec=recA.length?recA.reduce((a,b)=>a+b,0)/recA.length:0;
    const hasV=varA.some(v=>v>0),hasR=recA.some(v=>v>0);
    const curVar=cat.budget||0,curRec=cat.budgetRec||0;
    let sugVar=curVar,sugRec=curRec,chV=0,chR=0,nV='',nR='';
    if(hasV){
      if(avgVar>curVar*1.05||curVar===0){sugVar=r50(avgVar*1.15);chV=1;nV=`ממוצע ₪${fm(Math.round(avgVar))}`;}
      else if(curVar>0&&avgVar<curVar*0.7){sugVar=r50(avgVar*1.25);chV=-1;nV=`ממוצע ₪${fm(Math.round(avgVar))}`;}
      else{nV=`ממוצע ₪${fm(Math.round(avgVar))} — מאוזן`;}
    }else if(curVar>0){sugVar=0;chV=-1;nV='ללא שימוש ב-6 חודשים';}
    if(hasR){
      if(avgRec>curRec*1.05||curRec===0){sugRec=r50(avgRec*1.1);chR=1;nR=`ממוצע ₪${fm(Math.round(avgRec))}`;}
      else if(curRec>0&&avgRec<curRec*0.7){sugRec=r50(avgRec*1.15);chR=-1;nR=`ממוצע ₪${fm(Math.round(avgRec))}`;}
      else{nR=`ממוצע ₪${fm(Math.round(avgRec))} — מאוזן`;}
    }else if(curRec>0){sugRec=0;chR=-1;nR='ללא הוצאות קבועות ב-6 חודשים';}
    return{cat,curVar,curRec,sugVar,sugRec,chV,chR,nV,nR,avgVar,avgRec};
  });
  const totalCur=S.cats.reduce((s,c)=>s+(c.budget||0)+(c.budgetRec||0),0);
  let scaledForIncome=false;
  {
    let ts=sugs.reduce((s,x)=>s+x.sugVar+x.sugRec,0);
    if(avgInc>0&&ts>avgInc*MAX_RATIO){
      scaledForIncome=true;
      const scale=(avgInc*MAX_RATIO)/ts;
      sugs.forEach(x=>{
        const nV2=r50(x.sugVar*scale),nR2=r50(x.sugRec*scale);
        if(nV2!==x.sugVar){x.sugVar=nV2;x.chV=nV2<x.curVar?-1:nV2>x.curVar?1:0;}
        if(nR2!==x.sugRec){x.sugRec=nR2;x.chR=nR2<x.curRec?-1:nR2>x.curRec?1:0;}
      });
    }
  }
  const applyOne=(x)=>{
    const c=S.cats.find(c=>c.id===x.cat.id);if(!c)return;
    if(x.sugVar!==x.curVar){if(x.sugVar>0)c.budget=x.sugVar;else delete c.budget;}
    if(x.sugRec!==x.curRec){if(x.sugRec>0)c.budgetRec=x.sugRec;else delete c.budgetRec;}
    x.curVar=x.sugVar;x.curRec=x.sugRec;x.chV=0;x.chR=0;
    sv();rMon();
  };
  const applyFn=()=>{
    sugs.forEach(applyOne);ih("m2","");
  };
  const arrow=(ch,val,note)=>ch!==0?`<span style="font-size:12px;color:#a39686">→</span><span style="font-size:13px;font-weight:700;color:${ch>0?'#cf5a3e':'#4f8a68'}">₪${fm(val)}</span><span style="font-size:10px;background:${ch>0?'#f8e4dc':'#e4efe6'};color:${ch>0?'#b91c1c':'#3f7356'};border-radius:6px;padding:1px 5px">${ch>0?'↑':'↓'}</span><span style="font-size:10px;color:#a39686;flex:1">${note}</span>`:`<span style="font-size:10px;color:#a39686;flex:1">${note}</span>`;
  const doRender=()=>{
    const ts=sugs.reduce((s,x)=>s+x.sugVar+x.sugRec,0);
    const sav=avgInc>0?avgInc-ts:null;
    const rat=avgInc>0?Math.round(ts/avgInc*100):null;
    const rc=rat===null?'#7d7265':rat>90?'#cf5a3e':rat>80?'#f59e0b':rat>65?'#5b7f6b':'#4f8a68';
    const sc=sav===null?'#7d7265':sav<0?'#cf5a3e':sav<avgInc*0.1?'#f59e0b':sav<avgInc*0.2?'#5b7f6b':'#4f8a68';
    const sm=sav===null?'':sav<0?'התקציב חורג מהכנסה':sav<avgInc*0.1?'מומלץ לחסוך לפחות 20%':sav<avgInc*0.2?'קרוב ליעד — מומלץ להגדיל מעט':'חיסכון מצוין!';

    if(g('bsSavC')){g('bsSavC').style.background=bg;g('bsSavC').style.borderColor=bd;}
    if(g('bsSavA')){g('bsSavA').textContent=`₪${fm(Math.round(Math.max(0,sav||0)))}`;g('bsSavA').style.color=sc;}
    if(g('bsSavM'))g('bsSavM').textContent=sm;
    const changed=sugs.filter(x=>x.sugVar!==x.curVar||x.sugRec!==x.curRec);
    const rowsH=sugs.map((x,idx)=>{
      const hasChg=x.sugVar!==x.curVar||x.sugRec!==x.curRec;
      const vL=(x.curVar>0||x.sugVar>0)?`<div style="display:flex;align-items:center;gap:5px;margin-bottom:3px"><span style="font-size:10px;color:#a39686;width:36px;flex-shrink:0">משתנה</span><span style="font-size:12px;color:#7d7265">₪${fm(x.curVar)}</span>${arrow(x.chV,x.sugVar,x.nV)}</div>`:'';
      const rL=(x.curRec>0||x.sugRec>0)?`<div style="display:flex;align-items:center;gap:5px"><span style="font-size:10px;color:#a39686;width:36px;flex-shrink:0">קבוע</span><span style="font-size:12px;color:#7d7265">₪${fm(x.curRec)}</span>${arrow(x.chR,x.sugRec,x.nR)}</div>`:'';

      return`<div data-idx="${idx}" style="padding:10px;border-radius:10px;background:${hasChg?'#faf6ef':'#fff'};border:1px solid ${hasChg?'#c9d9ce':'#f3ece2'};margin-bottom:6px;${hasChg?'cursor:pointer;':''}" title="${hasChg?'לחץ להחלת הצעה זו':''}"><div style="display:flex;align-items:center;gap:6px;margin-bottom:6px"><div style="width:8px;height:8px;border-radius:50%;background:${x.cat.color};flex-shrink:0"></div><span style="font-weight:700;font-size:13px;color:#2f2a24">${x.cat.name}</span>${hasChg?'<span style="font-size:10px;background:#fff7ed;color:#d97706;border-radius:6px;padding:1px 6px">שינוי מוצע</span><span style="font-size:10px;color:#5b7f6b;margin-right:auto">← החל</span>':'<span style="font-size:10px;color:#4f8a68;margin-right:auto">✓ מאוזן</span>'}</div>${vL}${rL}</div>`;
    }).filter(r=>r).join('');
    g('bsList').innerHTML=rowsH||'<div style="text-align:center;color:#a39686;padding:24px">אין מספיק נתונים לניתוח</div>';
    g('bsApply').innerHTML=changed.length>0?`<div style="display:flex;gap:8px"><button id="applyBS" style="flex:2;padding:12px;border-radius:10px;border:none;color:#fff;font-weight:700;background:linear-gradient(135deg,#5b7f6b,#6f9480);cursor:pointer">החל את כל ${changed.length} השינויים</button><button id="cBS2" style="flex:1;padding:12px;border-radius:10px;border:none;color:#7d7265;background:#f3ece2;cursor:pointer">סגור</button></div>`:`<div style="text-align:center;color:#4f8a68;font-weight:700;font-size:13px">✓ כל התקציבים מאוזנים</div>`;
    if(g('applyBS'))g('applyBS').onclick=applyFn;
    if(g('cBS2'))g('cBS2').onclick=()=>ih('m2','');
    g('bsList').querySelectorAll('[data-idx]').forEach(el=>{

function doCSV(){
  let csv="﻿";
  for(let m=0;m<12;m++){
    csv+="\n"+MO[m]+" "+S.year+"\n";
    const inc=S.mData[m]?.income||[];
    if(inc.length){csv+="הכנסות\n";inc.forEach(e=>{csv+=(e.date||"")+","+(e.desc||"")+","+e.amount+"\n";});}
    csv+="קטגוריה,תקציב,הוצאה,יתרה,סטטוס,פירוט\n";
    S.cats.forEach(c=>{
      const ent=S.mData[m]?.[c.id]?.entries||[];
      const tot=ent.reduce((s,e)=>s+(parseFloat(e.amount)||0),0);
      const det=ent.map(e=>(e.recurring?'[q] ':'')+( e.date?e.date+" ":"")+( e.desc?e.desc+":":"")+e.amount).join(" | ");
      csv+=c.name+","+c.budget+","+tot+","+(c.budget-tot)+","+(c.budget>0&&tot>c.budget?"חריגה":"תקין")+",\""+det+"\"\n";
    });
    csv+="סה\"כ,,"+mt(m)+",,,\n";
  }
  const bl=new Blob([csv],{type:"text/csv;charset=utf-8"});
  const a=document.createElement("a");a.href=URL.createObjectURL(bl);a.download="תקציב_"+S.year+".csv";a.click();
}

// Payments made for an event expense: partial payments (pays: [{amt,date}]) plus the
// rest on the expense date once it is marked fully paid
function evPays(e){
  const amt=parseFloat(e.amount)||0,ps=(e.pays||[]).map(p=>({amt:parseFloat(p.amt)||0,date:p.date}));
  const sum=ps.reduce((t,p)=>t+p.amt,0);
  if(e.paid&&sum<amt)ps.push({amt:amt-sum,date:e.date});
  return ps;
}
function evPaid(e){return Math.min(parseFloat(e.amount)||0,evPays(e).reduce((t,p)=>t+p.amt,0));}

  g("evdBack").onclick=()=>rEvents();

    if(!confirm('למחוק את האירוע "'+ev.name+'"?'))return;
    EVENTS=EVENTS.filter(e=>e.id!==eid);saveEvents();rEvents();

  // Edit the event's total budget in place
  g("evBudEd").onclick=()=>{
    g("evBudBox").innerHTML=`<div style="font-size:10px;color:#a39686;margin-bottom:2px">תקציב</div><div style="display:flex;gap:4px"><input class="inp" id="evBudInp" type="number" inputmode="decimal" value="${ev.budget||''}" style="width:90px;padding:4px 6px;font-size:14px;text-align:center"/><button id="evBudOk" style="border:none;background:#5b7f6b;color:#fff;border-radius:8px;padding:0 8px;cursor:pointer">&#10003;</button></div>`;

  document.querySelectorAll(".edEvExp").forEach(el=>el.onclick=()=>{

    editExpId=x.id;showExpForm();
    g("expDesc").value=x.desc||'';g("expAmt").value=x.amount;g("expDate").value=x.date||today();g("expPaid").checked=!!x.paid;
    g("expFormTitle").textContent='✎ עריכת הוצאה';g("addExp").textContent='שמור שינויים';g("expCancel").style.display='';
    g("expAmt").focus();g("expAmt").select();
  });
  g("expCancel").onclick=()=>rEventDetail(eid);
  g("addExp").onclick=()=>{
    const desc=(g("expDesc").value||"").trim(),amt=parseFloat(g("expAmt").value),dt=g("expDate").value;
    if(!amt)return;
    const paid=!!(g("expPaid")?.checked);
    const x=editExpId&&ev.expenses.find(e=>e.id===editExpId);
    if(x)Object.assign(x,{desc:desc||'הוצאה',amount:amt,date:dt||today(),paid});
    else ev.expenses.push({id:Date.now(),desc:desc||'הוצאה',amount:amt,date:dt||today(),paid});
    saveEvents();rEventDetail(eid);
  };
  document.querySelectorAll(".payPart").forEach(btn=>btn.onclick=()=>{

    const v=parseFloat((prompt('כמה שילמת עכשיו? (נותר ₪'+fm(left)+')')||'').replace(/,/g,''));
    if(!(v>0))return;
    x.pays=[...(x.pays||[]),{amt:Math.min(v,left),date:today()}];
    if(evPaid(x)>=(parseFloat(x.amount)||0)-0.001)x.paid=true;

  });
  document.querySelectorAll(".togPay").forEach(btn=>btn.onclick=()=>{

    if(exp){exp.paid=!exp.paid;saveEvents();rEventDetail(eid);}

  document.querySelectorAll(".delEvExp").forEach(btn=>btn.onclick=()=>{
    ev.expenses=ev.expenses.filter(e=>e.id!==parseInt(btn.dataset.expid));
    saveEvents();rEventDetail(eid);
  });
}

function expCycleMonth(dateStr){
  const start=parseInt(getCfg().monthStart)||1;
  let m=cycleMonthForDate(dateStr,start);
  if(m===null)m=dateStr?parseInt(dateStr.split('-')[1])-1:S.month;
  return(m>=0&&m<=11)?m:S.month;
}
function evtMonthTotal(mo){
  return EVENTS.reduce((tot,ev)=>tot+(ev.expenses||[]).reduce((s,e)=>s+evPays(e).filter(p=>expCycleMonth(p.date)===mo).reduce((a,p)=>a+p.amt,0),0),0);
}

function rSearch(){
  // Collect all entries across all months and categories for the current year
  function allEntries(){
    const res=[];
    for(let m=0;m<12;m++){
      (S.mData[m]?.income||[]).forEach(e=>{
        res.push({...e,catName:'הכנסה',catColor:'#4f8a68',month:m,isIncome:true});
      });
      S.cats.forEach(c=>{
        (S.mData[m]?.[c.id]?.entries||[]).forEach(e=>{
          res.push({...e,catName:c.name,catColor:c.color,catId:c.id,month:m});
        });
      });
    }
    // Sort by date descending
    return res.sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  }

  ih("m2",`<div class="overlay" id="srchO"><div class="modal" style="padding:20px">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px">
      <span style="font-size:20px">&#128269;</span>
      <input class="inp" id="srchQ" placeholder="חיפוש לפי תיאור, סכום, קטגוריה..." style="flex:1;font-size:15px"/>
      <button id="cSrch" style="background:#f3ece2;border:none;border-radius:50%;width:32px;height:32px;cursor:pointer;font-size:18px;color:#7d7265;flex-shrink:0">&times;</button>
    </div>
    <div id="srchRes" style="max-height:65vh;overflow-y:auto"></div>
  </div></div>`);
  g("cSrch").onclick=()=>ih("m2","");
  g("srchO").onclick=e=>{if(e.target.id==="srchO")ih("m2","");};

  const entries=allEntries();

  function renderResults(q){
    const el=g("srchRes");if(!el)return;
    const qL=q.trim().toLowerCase();
    if(!qL){el.innerHTML='<div style="text-align:center;padding:28px;color:#a39686;font-size:13px">התחל להקליד כדי לחפש</div>';return;}
    const hits=entries.filter(e=>{
      const desc=(e.desc||'').toLowerCase();
      const amt=String(e.amount||'');
      const cat=(e.catName||'').toLowerCase();
      return desc.includes(qL)||amt.includes(qL)||cat.includes(qL);
    });
    if(!hits.length){el.innerHTML='<div style="text-align:center;padding:28px;color:#a39686;font-size:13px">לא נמצאו תוצאות</div>';return;}
    el.innerHTML=hits.slice(0,60).map(e=>`
      <div class="srchRow" data-m="${e.month}" data-cid="${e.catId||''}" style="display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:#fffdf9;border:1px solid #f3ece2;margin-bottom:6px;cursor:pointer">
        <div style="width:8px;height:8px;border-radius:50%;background:${e.catColor};flex-shrink:0"></div>
        <div style="flex:1;min-width:0">
          <div style="font-size:13px;font-weight:700;color:#2f2a24;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${e.desc||'(ללא תיאור)'}</div>
          <div style="font-size:11px;color:#a39686">${e.catName} &middot; ${moLabel(e.month)} ${S.year}${e.date?' &middot; '+fmDate(e.date):''}</div>
        </div>
        <span style="font-size:14px;font-weight:800;color:${e.isIncome?'#4f8a68':'#5b7f6b'};flex-shrink:0">${e.isIncome?'+':''}&#8362;${fm(e.amount)}</span>
      </div>`).join('');
    el.querySelectorAll(".srchRow").forEach((row,i)=>{
      const hit=hits[i];
      row.onclick=()=>{
        ih("m2","");
        S.month=hit.month;S.year=new Date().getFullYear();
        S.view="monthly";
        rAll();
        if(hit.catId){
          // Scroll to category card after render
          requestAnimationFrame(()=>{
            const card=document.querySelector(`[data-catid="${hit.catId}"]`);
            if(card)card.scrollIntoView({behavior:'smooth',block:'center'});
          });
        }
      };
    });
  }

  const inp=g("srchQ");
  inp.oninput=()=>renderResults(inp.value);
  renderResults('');
  requestAnimationFrame(()=>{if(inp)inp.focus();});
}
